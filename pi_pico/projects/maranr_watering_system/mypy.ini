# mypy.ini for Maranr Watering System
#
# NOTE that every section name *MUST* begin with '[mypy...'

[mypy]
  explicit_package_bases = True

  # NOTE py/lib is included just because the PICO has /lib by default
  # on its sys.path. We do not use /lib.
  mypy_path = typings:py/lib:py

  # Warns if there is a 'type: ignore...' on a line of code that is
  # not needed / no longer required.
  warn_unused_ignores = True

  check_untyped_defs = True

  # This turns off the [misc] error that is currently generated by
  # log=None,logrt=None,logi=None in many modules.
  # RHUtils.py has the same fix - requires a 2 line import plus
  #  log: Any = None.
  # It may also cause some 'real' errors to be ignored.
  # Too bad for now.
  disable_error_code = misc

  # These are 'strict' flags - they get errors in the current code
  # because there are almost no type annotations in the code yet.
  # We are holding off on adding them until we can do more 
  # investigation of how it will affect running the code on the Pico2 W.
  # Mainly the sizes of the code files and how much room they occupy on Pico.
  #disallow_untyped_defs = True
  #disallow_incomplete_defs = True
  #warn_return_any = True
  #disallow_any_generics = True

# Third-party library (micropython-async primitives): not my code, not my dog.
[mypy-primitives.*]
ignore_errors = True


[mypy-lib1.file_utils]
  # This section affects only lib1/file_utils.py
  check_untyped_defs = True
  ###ignore_errors = True


# As annotations are added, get more strict:
#  [mypy]
#  python_version = 3.12
#  explicit_package_bases = True
#  mypy_path = typings:py/lib:py
#  check_untyped_defs = True
#  warn_unused_ignores = True
#
# disallow_untyped_defs: every function must be fully annotated (arguments and return type).
# disallow_incomplete_defs: catches half-annotated functions, such as an annotated argument with no return type.
# warn_return_any: warns when a function declared to return a specific type actually returns an Any value, which is common when it returns something from unannotated code.
# disallow_any_generics: requires list[int] instead of bare list, dict[str, int] instead of dict.
# 
# Stricter checking for modules that are fully annotated
# A file py/lib/utils.py would be just [mypy-utils]
# A file py/sensors/MwsSensors.py is [mypy-sensors.MwsSensors]
# IOW the form is [mypy-MODULENAME]
# For a whole package:  [mypy-primitives.*]
# Can also list several items: this covers all primitives, all mws,
# and utils.py.
#   [mypy-primitives.*,mws.*,utils]   
# 
# Because py/lib/ is a root in itself (due to lib/ being on sys.path
# on the PICO), you must specify all the files in lib individually.
# For example if lib/ contains XXX.py and YYY.py:
#   [mypy-XXX,YYY,...etc...]
# The following line generates the list of names that should be listed
# after '[mypy-' 
#     ls py/lib/*.py | xargs -n1 basename -s .py | paste -sd, -
# NOTE: The command lists only .py files directly in lib/. 
# If a package folder ever lands there (an open-source library, say), 
# it needs its own name.* entry in the header. 
# The output from the 'ls ...' above will not include it.
#
# EXAMPLE:
# [mypy-sensors.MwsSensors]
#   disallow_untyped_defs = True
#   disallow_incomplete_defs = True
#   warn_return_any = True
#   disallow_any_generics = True

