# mypy.ini   for unit_tests_trials/
#
# Unit tests that run on both platforms

[mypy]
mypy_path = $MYPY_CONFIG_FILE_DIR/..:$MYPY_CONFIG_FILE_DIR/tests/cpython/support:$MYPY_CONFIG_FILE_DIR/tests/shared/test_support_stuff
explicit_package_bases = True
namespace_packages = True

# Warns if there is a 'type: ignore...' on a line of code that is
# not needed / no longer required.
warn_unused_ignores = True

# Check function/method even if it has no type annotations on
# the parameter and none for the return type
check_untyped_defs = True


[mypy-tests.*]
disallow_untyped_defs = True



